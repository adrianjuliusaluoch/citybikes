name: Fetch Fares
on:
  schedule:
    - cron: "0 18 * * *"  # 21:00 EAT / 18:00 UTC, daily
  workflow_dispatch:
concurrency:
  group: guardian-fares-job
  cancel-in-progress: false
jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install deps
        run: pip install pandas requests gspread google-auth
      - name: Run script
        env:
          GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}
        run: |
          python guardian.py
